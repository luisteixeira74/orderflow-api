services:
  postgres:
    image: postgres:17-alpine
    container_name: orderflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orderflow
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow_dev
    ports:
      - "5432:5432"
    volumes:
      - orderflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow -d orderflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:17-alpine
    container_name: orderflow-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: orderflow_test
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow_test_dev
    ports:
      - "5433:5432"
    volumes:
      - orderflow_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow -d orderflow_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  orderflow_data:
  orderflow_test_data:
